[workspace]
members = [
    # For executable crates
    "bin/*",
    # For library crates
    "lib/*"
]
resolver = "2"

[workspace.dependencies]
# local crates - bin
cli = {path = "./bin/cli", version = "0.0.0"}
migrations = {path = "./bin/migrations", version = "0.0.0"}
# local crates - libs
api = {path = "./lib/api", version = "0.0.0"}
db = {path = "./lib/db", version = "0.0.0"}
db_lib = {path = "./lib/db_lib", version = "0.0.0"}
goals_lib = {path = "./lib/goals_lib", version = "0.0.0"}

# non-local crates
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1.53", features = ["full"] }
clap = { version = "4.6", features = ["derive"] }
rusqlite = "0.40"
uuid = { version = "1.26", features = ["v4"]}
strum = { version = "0.28", features = ["derive"] }
directories = "6.0.0"
log = "0.4"
env_logger = "0.11"
clap-verbosity-flag = "3.0.4"
jiff = "0.2"
anyhow = "1.0"

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
opt-level = 3
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"